<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="app">
        <section class="hero">
            <p class="eyebrow">LIVE WEATHER</p>
            <h1>Weather <span>Today</span></h1>
            <p class="subtitle">Search any city and see the current weather.</p>

            <form id="searchForm" class="search-box">
                <input id="cityInput" type="text" placeholder="Enter city name..." autocomplete="off">
                <button type="submit">Search</button>
            </form>

            <p id="message"></p>
        </section>

        <section id="weatherCard" class="weather-card hidden">
            <div class="location">
                <div>
                    <p class="label">CURRENT WEATHER</p>
                    <h2 id="city"></h2>
                </div>
                <img id="weatherIcon" src="" alt="Weather icon">
            </div>

            <div class="main-weather">
                <div>
                    <p id="temperature" class="temperature">--°C</p>
                    <p id="weather" class="condition">--</p>
                </div>
            </div>

            <div class="details">
                <div><span>🌡️ Feels like</span><strong><span id="feelsLike">--</span>°C</strong></div>
                <div><span>💧 Humidity</span><strong><span id="humidity">--</span>%</strong></div>
                <div><span>💨 Wind</span><strong><span id="wind">--</span> m/s</strong></div>
            </div>
        </section>

        <footer>Powered by OpenWeather • FastAPI</footer>
    </main>

    <script src="/static/script.js"></script>
</body>
</html>
